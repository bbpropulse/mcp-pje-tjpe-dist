[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-pje-tjpe"
version = "0.7.1"
description = "Servidor MCP stdio local para serviços judiciais de Pernambuco"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [{ name = "Bruno Coutinho" }]
keywords = ["mcp", "pje", "tjpe", "sicajud", "datajud", "cap1g", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "keyring>=25.7,<26",
  "mcp>=2.1.1,<3",
  "platformdirs>=4.11,<5",
  "playwright==1.62.0",
  "psutil>=7.1,<8",
  "pydantic>=2.13,<3",
  "pypdf>=6.1,<7",
  "pyotp>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/bbpropulse/mcp-pje-tjpe-dist"
Issues = "https://github.com/bbpropulse/mcp-pje-tjpe-dist/issues"
Changelog = "https://github.com/bbpropulse/mcp-pje-tjpe-dist/blob/main/CHANGELOG.md"

[project.scripts]
pje-tjpe = "mcp_pje_tjpe.cli:app"

[dependency-groups]
dev = [
  "mcp[cli]>=2.1.1,<3",
  "pyright>=1.1.411,<2",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pje_tjpe"]

[tool.pytest.ini_options]
addopts = "-ra --ignore-glob='* [0-9].py'"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: acessa serviços públicos reais do TJPE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Mesmas duplicatas do Finder ignoradas pelo git: não são fonte do projeto.
extend-exclude = ["* [0-9].py", "* [0-9].md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
